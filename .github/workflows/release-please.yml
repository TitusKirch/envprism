# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Caller stub. release-please and the npm publish both live in
# kirchDev/workflows; this file carries the triggers and composes the two.

name: Release Please

on:
  push:
    branches:
      - main
      - dev

jobs:
  release-please:
    name: Release Please
    # `dev` reaches this workflow for the prerelease job below; release-please
    # itself only ever runs on the release branch.
    if: github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@f81bbe5fb5e8055b55a1ef5f861cc63a8e253622 # v0.1.3
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  publish-release:
    name: Publish stable release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC) and the provenance attestation. No
      # NPM_TOKEN exists in this repo; npm verifies this workflow against the
      # trusted publisher configured on the package.
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@f81bbe5fb5e8055b55a1ef5f861cc63a8e253622 # v0.1.3
    with:
      tag-name: ${{ needs.release-please.outputs.tag-name }}

  publish-prerelease:
    name: Publish prerelease
    # Skip the version-bump merges release-please pushes onto main.
    if: >-
      ${{
        github.ref_name == 'dev'
        || (
          github.ref_name == 'main'
          && !startsWith(github.event.head_commit.message, 'chore(main): release')
          && !startsWith(github.event.head_commit.message, 'chore: release')
        )
      }}
    permissions:
      contents: read
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@f81bbe5fb5e8055b55a1ef5f861cc63a8e253622 # v0.1.3
    with:
      prerelease: true
